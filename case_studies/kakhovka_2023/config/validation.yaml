# Spatial cross-validation design for the M2 evidence layer.
# Scoped extract from SWOT-DNIPRO scripts/p65b_m2_spatial_cv.py.
# source_commit_sha=f3e3e1afe91902a82a73f3c09354d1f9eb847766. Per 06_CONFIGURATION_DESIGN.md's table row
# "validation.yaml".

spatial_block_m: 5000.0        # p65b_m2_spatial_cv.py -- 5 km spatial blocks (blk5)
buffer_m: 3500.0               # p65b BUFFER_M -- the "buffered" regime's exclusion radius around the test set
buffer_grid_m: 40.0            # p65b COARSE -- auxiliary grid the buffer distance transform runs on

regimes: ["block", "buffered"]  # SAME outer test folds; buffered removes training cells within buffer_m of test
n_outer_folds: 5                 # implied by "5 outer runs" language throughout p65b/p66/p67b; block = outer fold id
n_inner_folds: 3                 # p65b N_INNER

n_bootstrap: 200                 # p65b N_BOOT -- spatial-block bootstrap, never a pixel bootstrap

reporting_layers:
  secondary: "all admissible weak labels of B1 and B2 -- the main result"
  primary: "consensus cells where two independent S1 caches agree -- a label-quality sensitivity subset, pooled
    out-of-fold only (too unevenly distributed across folds for a per-fold breakdown)"

# leave-one-zone-out is a LEGACY p51 concept (2 zones); not part of the M2/p65b design and not migrated here --
# see model.yaml's scope note.
leave_one_zone_out: TBD
