# Atomic claims of the 51 theses (publication/literature/theses.csv), hand-written 2026-09-28
# after reading every thesis, claims.md (C01–C14) and TERMINOLOGY.md.
#
# Rules (tools/paper3_audit/claims.py validates them):
#   * atomic_id = <thesis_id>.<letter>; every thesis has >= 1 claim.
#   * key_terms_primary is the DISTINGUISHING concept (never a metric or a generic word);
#     key_terms_support are the qualifier families; a paper is on topic only if the primary
#     family AND >= 1 support family occur in its full text (src.paper_3.theses.Thesis.is_on_topic).
#   * The thesis's own search_queries are always run first; extra_queries and
#     counterevidence_queries are appended, never substituted.
#   * required_roles: what the literature must supply for this claim (brief §3).
#   * manuscript_relevance is PROVISIONAL (brief §11); it is confirmed in overrides.yaml.
queries_version: "1.1.0"
authored_by: "Claude (Fable 5.1) for V. Nikoriak, 2026-09-28"

claims:

