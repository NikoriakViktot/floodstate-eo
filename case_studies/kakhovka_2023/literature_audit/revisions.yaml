  revised: 'their own category, because a Sentinel-1 dark-water onset there is a depth signal — the reeds are submerged —
    not the onset of

    inundation: in flooded vegetation the double bounce raises C-band backscatter above the non-flooded level, but once the
    water

    rises over the plants the signal turns dark (Grimaldi et al. 2020; Jarrett et al. 2023; review: Tsyganskaya et al. 2018),
