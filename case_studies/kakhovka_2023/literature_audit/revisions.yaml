  original: 'The destruction of the Kakhovka dam on 6 June 2023 released the largest reservoir of the Dnipro cascade into
    a 90 km reach

    with a densely populated left bank, a reed-wetland delta and the Dnipro–Buh liman (Vyshnevskyi et al. 2023; Shumilova
    et al.

    2025). Operational products reported the flooded area within days (UNOSAT via CEOBS 2023; REACH 2023), hydrodynamic

    reconstructions of the breach followed (Kadam et al. 2024), and the SWOT mission, on its one-day calibration orbit, observed

    the reach daily through the event (Lehnigk et al. 2026; Paper 1 of this series). Lehnigk et al. (2026) show with those
    daily

    SWOT water-surface elevations that two-dimensional outburst-flood simulations miss the observed stage and timing unless
    the

    bathymetry is right, and even then underestimate the peak stage (VERIFY); Yi et al. (2025) reconstruct the reservoir drainage

    (an initial breach flow of order 5.7 × 10⁴ m³ s⁻¹, VERIFY); Kadam et al. (2024) give a HEC-RAS scenario extent. What is
    still

    missing is a description of the inundation that does not depend on which sensor happened to look on which day: an extent,
    a

    depth and a volume for every day, tied to the observed water surface, with an uncertainty, and an account of where the

    satellite flood masks and such a reconstruction disagree and why. Terrain-based approaches that project a water surface
    or a

    mapped extent on a DEM (HAND: Rennó et al. 2008, Nobre et al. 2011; GeoFlood: Zheng et al. 2018; FwDET: Cohen et al. 2019)
    are

    first-order products, not hydrodynamics, and their depth and extent are sensitive to small vertical errors on low-relief

    floodplains, which spatially correlated DEM-error realisations propagate correctly (Darnell et al. 2008; Le et al. 2026).

    '
  revised: 'The destruction of the Kakhovka dam on 6 June 2023 released the largest reservoir of the Dnipro cascade — 18.2
    km³ at its

    normal retention level of 16.0 m, 19.8 km³ at the 16.76 m held on the eve of the breach (Vyshnevskyi et al. 2023) — into

    a ~90 km reach with a densely populated left bank, a reed-wetland delta and the Dnipro–Buh liman (Vyshnevskyi et al. 2023;

    Shumilova et al. 2025). Within days operational products reported the flooded *land*: about 620 km² over 6–9 June and
    about

    180 km² on 13 June in the UNOSAT products relayed by OCHA (CEOBS 2023), figures that later studies cite (Yailymov et al.

    2025). The published studies of the event are of three kinds. Satellite mappings give areas with their own definitions:

    Yailymov et al. (2025) map 473 km² of flooded land as of 9 June by land-cover class, 294 km² of it wetlands, against a

    pre-flood water map of 5 June; Zuo et al. (2024) follow the water-surface area at 300 m in Sentinel-3 OLCI scenes, which

    doubled within three days and was largest around 9 June; Monti et al. (2024) map the flooding along ~80 km of river with

    Sentinel-1 change detection; Jiao et al. (2025) use the event to test a Sentinel-1 flood-extraction method. Hydrodynamic

    models give scenario extents and stages: Kadam et al. (2024) obtain 823 km² and a peak of 3.6 × 10⁴ m³ s⁻¹ for a 300 m

    breach in HEC-RAS; Agerbeek et al. (2024) ran a near-real-time model checked against ICEYE extents and geolocated

    photographs; and Lehnigk et al. (2026) show with the daily SWOT water-surface elevations of the one-day calibration orbit

    — the data we use here — that two-dimensional outburst-flood simulations underestimate the observed peak stages by 1.4
    to

    6.1 m and misplace their timing unless reservoir and channel bathymetry are corrected, and even then reproduce neither

    stage nor timing fully; downstream stages reached 10–11 m by 8 June. Reservoir-side balances give the volume released:

    Yi et al. (2025) derive an initial breach flow of (5.7 ± 0.8) × 10⁴ m³ s⁻¹ and 20.4 ± 1.4 km³ lost in 30 days from

    gravimetry, altimetry and imagery; Shumilova et al. (2025) model about 16.4 km³ over two weeks. What none of these gives
    is

    a description of the inundation that depends neither on which sensor happened to look on which day nor on a hydrodynamic

    model whose bathymetry is unknown: an extent, a depth and a volume for every day, tied to the observed water surface,
    with

    an uncertainty, and an account of where the satellite flood masks and such a reconstruction disagree and why.

    Terrain-based approaches that project a water surface or a mapped extent on a DEM — HAND (Rennó et al. 2008; Nobre et
    al.

    2011), GeoFlood (Zheng et al. 2018), FwDET (Cohen et al. 2019) — are first-order products, not hydrodynamics: Johnson
    et

    al. (2019) find that a HAND-based method "does not accurately capture inundated cells" while it does highlight regions
    at

    risk. Their depth and extent are sensitive to small vertical errors on low-relief floodplains, and because DEM error is

    spatially autocorrelated whereas accuracy statistics such as RMSE "assume error to [be] aspatial" (Hawker et al. 2018),
    it

    must be propagated with spatially correlated error realisations (Darnell et al. 2008; Le et al. 2026), not with

    independent noise.

    '
