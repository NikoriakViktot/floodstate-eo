[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "floodstate-eo"
version = "0.1.0a0"
description = "Context-Aware Multisensor Earth Observation for Flood-State Reconstruction"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Viktor Nikoriak" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "rasterio",
    "scipy",
    "scikit-learn",
    "pyproj",
    "shapely",
    "requests",
    "python-dotenv",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
# M6 segmentation (case_studies/*/workflows/m6): versions as used for the frozen U0_B2_CORRECTED run
m6 = ["torch==2.14.0", "segmentation-models-pytorch==0.5.0", "timm==1.0.30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
